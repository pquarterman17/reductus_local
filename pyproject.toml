[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reductus"
dynamic = ["version"]
description = "Data reduction for neutron scattering"
readme = "README.rst"
requires-python = ">=3.9"
license = {text = "Public Domain"}
authors = [
    {name = "Paul Kienzle", email = "paul.kienzle@nist.gov"},
    {name = "Brian Maranville", email = "brian.maranville@nist.gov"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: Public Domain",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "scipy",
    "numpy",
    "uncertainties",
    "docutils",
    "pytz",
    # Web server runtime: the `reductus` console command IS the web/desktop
    # server, so these are mandatory rather than optional. Keeping them here
    # means a bare `pip install reductus` never crashes on a missing flask_cors.
    "msgpack",
    "flask",
    "flask-cors",
    "requests",
    "platformdirs",
]

[project.optional-dependencies]
# Retained for backward compatibility; these packages are now part of the core
# install (see dependencies above), so `.[server]` is effectively a no-op.
server = ["msgpack", "flask", "flask-cors", "requests", "platformdirs"]
# pywebview < 5 crashes with pythonnet 3.x on Windows (NullReferenceException
# in the WinForms backend at window creation), so require the modern series.
desktop = ["pywebview>=5"]
masked_curve_fit = ["numdifftools"]
nexus_files = ["h5py"]
all = ["msgpack", "flask", "flask-cors", "requests", "numdifftools", "h5py", "platformdirs", "pywebview>=5"]

[project.scripts]
reductus = "reductus.web_gui.run:main"

[tool.setuptools.dynamic]
version = { attr = "reductus.__version__" }

[tool.setuptools.packages.find]
include = ["reductus*"]

[tool.pytest.ini_options]
python_files = "reductus/**/*.py"
norecursedirs = ".* __pycache__ build _build dist *.egg* provisioning docker-compose *-old junk explore web_gui doc"
addopts = "--ignore=setup.py --doctest-modules"
testpaths = ["tests"]
